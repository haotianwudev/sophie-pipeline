name: Deploy spx-options-api

on:
  push:
    branches: [master]
    paths:
      - "services/spx-options-api/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/282034489414/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: spx-options-deployer@longsky.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy spx-options-api \
            --source services/spx-options-api \
            --project longsky \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 512Mi \
            --concurrency 80 \
            --min-instances 0 \
            --max-instances 2 \
            --quiet
